<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngalam Fix Pro • Spesialis Servis HP Android & iPhone Terpercaya</title>
    <meta name="description" content="Pusat servis spesialis smartphone Android dan Apple iPhone terpercaya di Malang. Bisa ditunggu, garansi baterai 90 hari (servis lain 7–30 hari), suku cadang original, konsultasi WhatsApp resmi." />
    <link rel="icon" type="image/jpeg" href="/images/logo-ngalam-fix-pro.jpg" />
    <link rel="apple-touch-icon" href="/images/logo-ngalam-fix-pro.jpg" />
    <link rel="stylesheet" href="/css/style.css?v=8.7" />
    <link rel="stylesheet" href="/css/mobile-system.css?v=8.7" />
    <link rel="stylesheet" href="/css/preloader.css?v=2.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ngalam_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <script src="/js/device-sensor.js?v=8.7"></script>
    <script src="/js/preloader.js"></script>
  </head>
  <body class="home-page-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
